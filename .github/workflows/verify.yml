name: Verify dashboard core

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Compile platform-independent dashboard code
        run: python -m py_compile jarvis_platform.py jarvis_dashboard.py download_models.py jarvis_app.py
      - name: Check model downloader interface
        run: python download_models.py --help
